name: Process one day
description: Download one adsb.lol day on the runner, extract airline flights, upload them to the month's release.
inputs:
  day:
    description: YYYY-MM-DD
    required: true
  urls:
    description: Space-separated adsb.lol release asset URLs for that day, in order
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DAY: ${{ inputs.day }}
        URLS: ${{ inputs.urls }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad day: $DAY"; exit 1; }
        parts="$RUNNER_TEMP/parts"; mkdir -p "$parts" out
        i=0
        for url in $URLS; do
          [[ "$url" == https://github.com/adsblol/* ]] || { echo "unexpected source: $url"; exit 1; }
          i=$((i+1))
          curl -sSfL --retry 5 --retry-delay 15 -o "$parts/$(printf %02d $i)" "$url"
        done
        cat "$parts"/* | python3 scripts/extract_day.py "$DAY" out
        rm -rf "$parts"
        month="${DAY:0:7}"
        gh release view "data-$month" >/dev/null 2>&1 || gh release create "data-$month" --title "Flights $month" \
          --notes "Airline flight legs seen by adsb.lol receivers in $month, one file pair per day. Derived from adsb.lol globe_history (c) adsb.lol contributors, ODbL 1.0. See README.md." || true
        gh release upload "data-$month" "out/flights-$DAY.jsonl.gz" "out/paths-$DAY.jsonl.gz" --clobber
        echo "### $DAY: $(zcat "out/flights-$DAY.jsonl.gz" | wc -l) flight legs" >> "$GITHUB_STEP_SUMMARY"

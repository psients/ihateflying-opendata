name: Process one day
description: Download one adsb.lol day on the runner, extract airline flights, upload the summaries to the month's release.
inputs:
  day:
    description: YYYY-MM-DD
    required: true
  urls:
    description: Space-separated adsb.lol release asset URLs for that day, in order
    required: true
runs:
  using: composite
  steps:
    # Step 1: download and extract. NO TOKEN in this step's environment:
    # it parses untrusted archive bytes, and a compromise there must find
    # nothing to steal.
    - shell: bash
      env:
        DAY: ${{ inputs.day }}
        URLS: ${{ inputs.urls }}
      run: |
        set -euo pipefail
        [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad day: $DAY"; exit 1; }
        parts="$RUNNER_TEMP/parts"; mkdir -p "$parts" out
        i=0
        for url in $URLS; do
          [[ "$url" =~ ^https://github\.com/adsblol/globe_history_[0-9]{4}/releases/download/[A-Za-z0-9._+-]+/[A-Za-z0-9._%+-]+$ ]] \
            || { echo "unexpected source url: $url"; exit 1; }
          i=$((i+1))
          curl -sSfL --retry 5 --retry-delay 15 --max-filesize 2147483647 -o "$parts/$(printf %02d $i)" "$url"
        done
        # Which archive release produced this day (staging runs ~15% smaller
        # than prod; a consumer deserves to know which it is reading).
        SOURCE_TAG="$(printf '%s' "$URLS" | awk '{print $1}' | sed -E 's#.*/download/([^/]+)/.*#\1#')"
        export SOURCE_TAG
        cat "$parts"/* | python3 scripts/extract_day.py "$DAY" out
        rm -rf "$parts"
        # Sanity gate: a day that extracts implausibly (an old format
        # quirk, a half archive) must FAIL LOUDLY, never publish - a
        # published day is marked done forever.
        python3 scripts/sanity_gate.py "$DAY" out

    # Step 2: publish. The token exists only here.
    - shell: bash
      env:
        DAY: ${{ inputs.day }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        month="${DAY:0:7}"
        # Create-or-reuse the month's release (backfill pre-creates months
        # serially in its plan job; this is the fallback).
        bash scripts/ensure_release.sh "$month"
        # GitHub's secondary limit (~500 content-writes/hour) can 403 a burst;
        # back off and retry rather than redden the day.
        for attempt in 1 2 3 4 5; do
          if gh release upload "data-$month" "out/flights-$DAY.jsonl.gz" "out/paths-$DAY.jsonl.gz" "out/meta-$DAY.json" --clobber; then
            break
          elif [ "$attempt" = 5 ]; then
            echo "upload failed after 5 attempts"; exit 1
          else
            sleep $((attempt * 60))
          fi
        done
        echo "### $DAY" >> "$GITHUB_STEP_SUMMARY"
        sed 's/^/    /' "out/meta-$DAY.json" >> "$GITHUB_STEP_SUMMARY"

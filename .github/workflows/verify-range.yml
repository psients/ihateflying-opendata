name: Verify range

# Quarantine verification of a backfill batch: every published day in the
# range is re-read and checked against the red-team invariants
# (scripts/verify.py), each day with its predecessor as cross-midnight
# context. Day records are COMMITTED BEFORE the job honours a red, so a
# failing day can never vanish with the runner. The drill input writes a
# deliberate, clearly-labelled red to prove the failure-email channel.
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First day, YYYY-MM-DD'
        required: false
        default: ''
      end:
        description: 'Last day, YYYY-MM-DD'
        required: false
        default: ''
      drill:
        description: "Type 'drill' to fire a deliberate test red instead"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: opendata-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DRILL: ${{ inputs.drill }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$DRILL" = "drill" ]; then
            python3 scripts/verify.py drill || failed=1
          else
            python3 scripts/verify.py range "$START" "$END" || failed=1
          fi
          git add quarantine/days
          if git -c user.name=opendata-bot -c user.email=actions@github.com commit -m "quarantine: verify ${DRILL:-$START..$END}"; then
            for attempt in 1 2 3; do
              git push && break || {
                git -c user.name=opendata-bot -c user.email=actions@github.com pull --rebase
                [ "$attempt" = 3 ] && exit 1
              }
            done
          fi
          exit "$failed"

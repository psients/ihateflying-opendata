name: Verify range

# Quarantine verification of a backfill batch: every published day in the
# range is re-read and checked against the red-team invariants
# (scripts/verify.py), each day with its predecessor as cross-midnight
# context. Day records are COMMITTED BEFORE the job honours a red, so a
# failing day can never vanish with the runner. The drill input writes a
# deliberate, clearly-labelled red to prove the failure-email channel.
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First day, YYYY-MM-DD'
        required: false
        default: ''
      end:
        description: 'Last day, YYYY-MM-DD'
        required: false
        default: ''
      drill:
        description: "Type 'drill' to fire a deliberate test red instead"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: opendata-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DRILL: ${{ inputs.drill }}
        run: |
          set -uo pipefail
          failed=0
          if [ "$DRILL" = "drill" ]; then
            python3 scripts/verify.py drill || failed=1
          else
            python3 scripts/verify.py range "$START" "$END" || failed=1
          fi
          mkdir -p "$RUNNER_TEMP/produced"
          git status --porcelain --untracked-files=all -- quarantine | awk '{print $NF}' |
            while read -r f; do
              mkdir -p "$RUNNER_TEMP/produced/$(dirname "$f")"
              cp "$f" "$RUNNER_TEMP/produced/$f"
            done
          # Records are committed BEFORE the red is honoured: a failing day
          # must reach the log, never vanish with the runner.
          bash scripts/commit_state.sh "verify: ${DRILL:-$START..$END}" "$RUNNER_TEMP/produced" render
          exit "$failed"

name: Backfill

# Processes every archived day between two dates that this repository has
# not published with the current extractor version (at most 250 days per
# run; run again to continue; the end date is capped at today-16: the daily
# job's self-heal owns the newest 15 days, so the two never race). Run ONE
# batch at a time: GitHub keeps at most one pending run per concurrency
# group and CANCELS the older pending one, so dispatch the next batch only
# when this group is idle.
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First day, YYYY-MM-DD (archive starts 2023-02-16)'
        required: true
      end:
        description: 'Last day, YYYY-MM-DD (capped at today-2)'
        required: true

permissions:
  contents: write

concurrency:
  group: opendata-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      count: ${{ steps.p.outputs.count }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python3 scripts/plan.py range "$START" "$END"

  days:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/process
        with:
          day: ${{ matrix.day }}
          urls: ${{ matrix.urls }}

  reindex:
    needs: [plan, days]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/manifest.py reindex
          git add MANIFEST.json
          if git -c user.name=opendata-bot -c user.email=actions@github.com commit -m "manifest: backfill reindex"; then
            for attempt in 1 2 3; do
              git push && break || {
                git -c user.name=opendata-bot -c user.email=actions@github.com pull --rebase
                [ "$attempt" = 3 ] && exit 1
              }
            done
          else
            echo "manifest unchanged"
          fi

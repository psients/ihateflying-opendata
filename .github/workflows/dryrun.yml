name: Weekly dry-run

# Runs the REAL aggregation (scripts/aggregate.py, the published counting
# method) over every published day, with public stand-in inputs, so the
# quarantine month exercises the counting chain and not just file
# production. RED when any airframe's floor decreases (floors are monotone
# by construction) or the memory budget breaks. Also writes the week's
# seeded spot-check selection, chosen by the manifest's hash so nobody can
# cherry-pick the sample.
on:
  schedule:
    - cron: '17 9 * * 0'   # Sundays 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: opendata-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          python3 scripts/dryrun.py || failed=1
          git add dryrun
          if git -c user.name=opendata-bot -c user.email=actions@github.com commit -m "dry-run: $(date -u +%F)"; then
            for attempt in 1 2 3; do
              git push && break || {
                git -c user.name=opendata-bot -c user.email=actions@github.com pull --rebase
                [ "$attempt" = 3 ] && exit 1
              }
            done
          fi
          exit "$failed"

name: Daily flights

# Processes the newest adsb.lol archive days and publishes the summaries to
# this repository's releases. The one red condition: the day before yesterday
# is neither published here nor available from any adsb.lol instance (a dead
# pipeline or a dead source, caught within ~53 hours). A merely-late adsb.lol
# publish is a warning, never an email. adsb.lol publishes each day at about
# 03:30 UTC the following day.
on:
  schedule:
    - cron: '17 5 * * *'   # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to process, YYYY-MM-DD (empty = the newest days)'
        required: false
        default: ''

permissions:
  contents: write

# Own group: the backfill ends at today-16 while this job self-heals
# today-15 .. today-1, so the two workflows process disjoint day sets and
# need no shared group. GitHub keeps at most one PENDING run per group and
# cancels the older pending one - sharing a group would let the daily cron
# silently cancel a queued backfill batch.
concurrency:
  group: opendata-day
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      count: ${{ steps.p.outputs.count }}
      red: ${{ steps.p.outputs.red }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.date }}
        run: python3 scripts/plan.py one "$DAY"

  # The alarm is its own job so self-heal work still runs on a red morning:
  # a dead source must not also stop the healing of days it already has.
  alarm:
    needs: plan
    if: needs.plan.outputs.red != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RED: ${{ needs.plan.outputs.red }}
        run: |
          echo "::error::$RED"
          exit 1

  days:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/process
        with:
          day: ${{ matrix.day }}
          urls: ${{ matrix.urls }}

  # Quarantine verifier: re-reads yesterday's PUBLISHED files and checks
  # the red-team invariants (I1-I10 in scripts/verify.py). A break = red =
  # email. The log it appends, QUARANTINE.md, is the record the owner reads:
  # the site touches none of this data until it shows 30 consecutive clean
  # days with every red explained.
  verify:
    needs: [plan, days]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify.py daily
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quarantine-log
          path: QUARANTINE.md
          if-no-files-found: ignore

  manifest:
    needs: [plan, days, verify]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quarantine-log
        continue-on-error: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/manifest.py reindex
          git add MANIFEST.json
          [ -f QUARANTINE.md ] && git add QUARANTINE.md
          if git -c user.name=opendata-bot -c user.email=actions@github.com commit -m "manifest: $(date -u +%F)"; then
            for attempt in 1 2 3; do
              git push && break || {
                git -c user.name=opendata-bot -c user.email=actions@github.com pull --rebase
                [ "$attempt" = 3 ] && exit 1
              }
            done
          else
            echo "manifest unchanged"
          fi

name: Daily flights

# Processes the newest adsb.lol archive days and publishes the summaries to
# this repository's releases. The one red condition: the day before yesterday
# is neither published here nor available from any adsb.lol instance (a dead
# pipeline or a dead source, caught within ~53 hours). A merely-late adsb.lol
# publish is a warning, never an email. adsb.lol publishes each day at about
# 03:30 UTC the following day.
on:
  schedule:
    - cron: '17 5 * * *'   # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to process, YYYY-MM-DD (empty = the newest days)'
        required: false
        default: ''

permissions:
  contents: write

# Own group: the backfill ends at today-16 while this job self-heals
# today-15 .. today-1, so the two workflows process disjoint day sets and
# need no shared group. GitHub keeps at most one PENDING run per group and
# cancels the older pending one - sharing a group would let the daily cron
# silently cancel a queued backfill batch.
concurrency:
  group: opendata-day
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      count: ${{ steps.p.outputs.count }}
      red: ${{ steps.p.outputs.red }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.date }}
        run: python3 scripts/plan.py one "$DAY"

  # The alarm is its own job so self-heal work still runs on a red morning:
  # a dead source must not also stop the healing of days it already has.
  alarm:
    needs: plan
    if: needs.plan.outputs.red != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RED: ${{ needs.plan.outputs.red }}
        run: |
          echo "::error::$RED"
          exit 1

  days:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/process
        with:
          day: ${{ matrix.day }}
          urls: ${{ matrix.urls }}

  # Quarantine verifier: sweeps the last 17 days, verifies every published
  # day that lacks a record, and writes one record file per day. Only the
  # records it WROTE travel to the commit job (never its whole checkout, so a
  # concurrent writer's newer record can't be overwritten by a stale copy).
  # A red = failed job = email. The site touches none of this data until
  # QUARANTINE.md's exit rules are met.
  verify:
    needs: [plan, days]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          failed=0
          python3 scripts/verify.py daily || failed=1
          mkdir -p "$RUNNER_TEMP/produced"
          git status --porcelain --untracked-files=all -- quarantine | awk '{print $NF}' |
            while read -r f; do
              mkdir -p "$RUNNER_TEMP/produced/$(dirname "$f")"
              cp "$f" "$RUNNER_TEMP/produced/$f"
            done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quarantine-produced
          path: ${{ runner.temp }}/produced/
          if-no-files-found: ignore

  manifest:
    needs: [plan, days, verify]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quarantine-produced
          path: ${{ runner.temp }}/produced/
        continue-on-error: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/commit_state.sh "daily: $(date -u +%F)" "$RUNNER_TEMP/produced" manifest render

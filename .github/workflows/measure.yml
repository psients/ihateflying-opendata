name: Measure instances

# Compares adsb.lol archive instances for chosen days WITHOUT publishing:
# each DAY:INSTANCE pair is downloaded and extracted exactly as the
# publishing path does it, and its completeness stats (scripts/day_stats.py)
# land in the job summary and a stats artifact. Used to choose a day's
# source before writing a scripts/source_overrides.txt line (verify I12).
# Read-only: this workflow can never upload a release asset or commit.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Space-separated DAY:INSTANCE pairs, e.g. 2023-03-10:test-0 2023-03-10:staging-0'
        required: true

permissions:
  contents: read

concurrency:
  group: opendata-measure
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      count: ${{ steps.p.outputs.count }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          PAIRS: ${{ inputs.pairs }}
        run: python3 scripts/plan.py pairs "$PAIRS"

  measure:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # No token here: this parses untrusted archive bytes.
      - env:
          DAY: ${{ matrix.day }}
          INST: ${{ matrix.inst }}
          URLS: ${{ matrix.urls }}
        run: |
          set -euo pipefail
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad day: $DAY"; exit 1; }
          [[ "$INST" =~ ^[a-z0-9-]+$ ]] || { echo "bad instance: $INST"; exit 1; }
          parts="$RUNNER_TEMP/parts"; mkdir -p "$parts" out stats
          i=0
          for url in $URLS; do
            [[ "$url" =~ ^https://github\.com/adsblol/globe_history_[0-9]{4}/releases/download/[A-Za-z0-9._+-]+/[A-Za-z0-9._%+-]+$ ]] \
              || { echo "unexpected source url: $url"; exit 1; }
            i=$((i+1))
            curl -sSfL --retry 10 --retry-all-errors --max-filesize 2147483647 -o "$parts/$(printf %02d $i)" "$url"
          done
          SOURCE_TAG="$(printf '%s' "$URLS" | awk '{print $1}' | sed -E 's#.*/download/([^/]+)/.*#\1#')"
          export SOURCE_TAG
          cat "$parts"/* | python3 scripts/extract_day.py "$DAY" out
          rm -rf "$parts"
          python3 scripts/day_stats.py "$DAY" out | tee "stats/$DAY-$INST.json"
          { echo "### $DAY $INST"; sed 's/^/    /' "stats/$DAY-$INST.json"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stats-${{ matrix.day }}-${{ matrix.inst }}
          path: stats/
